<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>EvidenceGuard - Version History</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f4f7fb;
    color: #172b4d;
}

.navbar {
    background: #172b4d;
    color: white;
    padding: 18px 30px;
    font-size: 23px;
    font-weight: bold;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 20px;
}

.header {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.version {
    background: white;
    margin-top: 20px;
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.version-number {
    font-size: 24px;
    font-weight: bold;
    color: #172b4d;
}

.info {
    margin-top: 15px;
    background: #f5f7fa;
    padding: 15px;
    border-radius: 8px;
    line-height: 1.9;
}

.current {
    display: inline-block;
    margin-left: 10px;
    padding: 5px 10px;
    border-radius: 15px;
    background: #e7f6ec;
    color: #176b35;
    font-size: 12px;
}

button {
    margin-top: 25px;
    padding: 12px 20px;
    border: none;
    border-radius: 7px;
    background: #666;
    color: white;
    cursor: pointer;
}

.open {
    background: #172b4d;
    margin-top: 15px;
}

.empty {
    background: white;
    padding: 30px;
    margin-top: 20px;
    border-radius: 10px;
    text-align: center;
}

</style>

</head>


<body>


<div class="navbar">

🛡️ EvidenceGuard — Version History

</div>


<div class="container">


<div class="header">

<h1>
🕘 Document Version History
</h1>

<p>
Track every modification made to the document.
</p>

<div id="documentInfo">
Loading...
</div>

</div>


<div id="versions">

Loading version history...

</div>


<button
onclick="location.href='documents.html'">

← Back to Documents

</button>


</div>


<script>


// ============================================
// GET URL PARAMETERS
// ============================================

const params =
new URLSearchParams(
window.location.search
);


const caseId =
params.get("caseId");


const documentName =
params.get("documentName");


const decodedCaseId =
caseId
? decodeURIComponent(caseId)
: "";


const decodedDocumentName =
documentName
? decodeURIComponent(documentName)
: "";


document.getElementById(
"documentInfo"
).innerHTML = `

<b>Case ID:</b>
${decodedCaseId || "N/A"}

<br>

<b>Document:</b>
${decodedDocumentName || "N/A"}

`;


// ============================================
// LOAD VERSION HISTORY
// ============================================

async function loadVersions() {

    const container =
        document.getElementById(
            "versions"
        );


    try {

        const response =
            await fetch(
                "/api/versions/" +
                encodeURIComponent(
                    decodedCaseId
                ) +
                "/" +
                encodeURIComponent(
                    decodedDocumentName
                )
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load version history"
            );

        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                "Version data unavailable"
            );

        }


        const versions =
            Array.isArray(data.versions)
            ? data.versions
            : [];


        if (versions.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    <h2>
                        📂 No Versions Found
                    </h2>

                    <p>
                        No modifications have been
                        recorded for this document yet.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        versions
        .slice()
        .reverse()
        .forEach(
            function(version, index) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "version";


                const latest =
                    index === 0;


                div.innerHTML = `

                    <div class="version-number">

                        Version ${version.version}

                        ${
                            latest
                            ? '<span class="current">LATEST</span>'
                            : ''
                        }

                    </div>


                    <div class="info">

                        <b>Case ID:</b>
                        ${version.caseId || "N/A"}

                        <br>

                        <b>Document:</b>
                        ${version.documentName || "N/A"}

                        <br>

                        <b>File:</b>
                        ${version.fileName || "N/A"}

                        <br>

                        <b>Modified By:</b>
                        👤 ${version.modifiedBy || "N/A"}

                        <br>

                        <b>Modified At:</b>
                        🕐 ${version.modifiedAt || "N/A"}

                    </div>


                    <button
                    class="open"
                    onclick="
                        openVersion(
                            '${encodeURIComponent(
                                version.fileName
                            )}'
                        )
                    ">

                    📄 Open Version

                    </button>

                `;


                container.appendChild(div);

            }
        );

    }


    catch(error) {

        console.error(error);


        container.innerHTML = `

            <div class="empty">

                <h2>
                    ❌ Unable to Load Version History
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }

}


// ============================================
// OPEN VERSION
// ============================================

function openVersion(
    encodedFileName
) {

    const fileName =
        decodeURIComponent(
            encodedFileName
        );


    const officerId =
        localStorage.getItem(
            "officerId"
        ) || "POL1001";


    const url =
        "/api/document/" +
        encodeURIComponent(
            fileName
        ) +
        "?officerId=" +
        encodeURIComponent(
            officerId
        );


    window.open(
        url,
        "_blank"
    );

}


// ============================================
// START
// ============================================

loadVersions();

</script>


</body>

</html>
