<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EvidenceGuard - Secure Login</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef3f8;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .logo {
            text-align: center;
            font-size: 42px;
        }

        h1 {
            text-align: center;
            color: #172b4d;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd5e0;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #172b4d;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #172b4d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d1c35;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .security {
            margin-top: 25px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: #555;
        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">
            🛡️
        </div>


        <h1>
            EvidenceGuard
        </h1>


        <p class="subtitle">
            Secure Legal & Investigation
            Document Management
        </p>


        <form id="loginForm">


            <label for="officerId">
                Officer ID
            </label>

            <input
                type="text"
                id="officerId"
                placeholder="Enter Officer ID"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >


            <button type="submit">
                🔐 Secure Login
            </button>


        </form>


        <p id="message"></p>


        <div class="security">

            🔒 Protected by
            Secure Access Control

        </div>


    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const id =
                        document
                        .getElementById("officerId")
                        .value
                        .trim();


                    const password =
                        document
                        .getElementById("password")
                        .value;


                    const message =
                        document
                        .getElementById("message");


                    message.innerText =
                        "Authenticating...";


                    try {

                        const response =
                            await fetch(
                                "http://localhost:3000/api/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({
                                        id: id,
                                        password: password
                                    })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok ||
                            !data.success) {

                            message.innerText =
                                "❌ " +
                                (data.message ||
                                "Login failed");

                            return;
                        }


                        localStorage.setItem(
                            "officerId",
                            data.user.id
                        );


                        localStorage.setItem(
                            "officerName",
                            data.user.name
                        );


                        localStorage.setItem(
                            "officerRole",
                            data.user.role
                        );


                        message.innerText =
                            "✅ Login successful";


                        window.location.href =
                            "dashboard.html";

                    }


                    catch (error) {

                        console.error(error);

                        message.innerText =
                            "❌ Unable to connect to EvidenceGuard server.";

                    }

                }
            );

    </script>


</body>

</html>
